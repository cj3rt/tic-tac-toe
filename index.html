<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="game-container">
        <h1>Tic-Tac-Toe</h1>
        <div id="player-setup">
            <input type="text" id="player1-name" placeholder="Player 1 Name" value="Player 1">
            <input type="text" id="player2-name" placeholder="Player 2 Name" value="Player 2">
            <button id="start-game">Start Game</button>
        </div>
        <div id="game-board" class="hidden">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>
        <div id="game-status"></div>
        <button id="restart-game" class="hidden">Play Again</button>
        <button id="new-game" class="hidden">New Game</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
